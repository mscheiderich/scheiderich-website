<!--
  LIFE QUOTE PAGE: SETTINGS FILE for one agent.
  Everything a visitor sees comes from /includes/life-quote-body.html. This file
  holds only the agent's settings and the <head>, which reads them too.

  TO ADD AN AGENT
    1. Copy this file to /life-quote/{agent-slug}/index.html.
    2. Change the settings below. Nothing else in this file changes.
    3. Add the slug and email to CONFIG.NOTIFY in the Life Leads Apps Script,
       then deploy it as a NEW VERSION of the existing deployment (never New
       deployment: that changes the URL). Until then the script rejects the
       agent's leads and the page shows its "couldn't confirm" message.
    4. Add the slug to the 'life-quote' entry in /team/landing-pages.js
       (agents), and to 'life-quote-es' too if AGENT_SPANISH is yes.
    5. Do NOT add the page to sitemap.xml (noindex campaign page).

  SETTINGS
    AGENT_NAME, AGENT_FIRST, AGENT_SLUG   name, first name, slug
    AGENT_PRONOUN / AGENT_PRONOUN_LC      She / she (He / he, They / they)
    AGENT_PHOTO, AGENT_PHOTO_ALT          headshot path and alt text. A new
                                          headshot is a one-line change.
    AGENT_EMAIL                           for reference: the routing email in
                                          the script's CONFIG.NOTIFY
    AGENT_TEXT                            the agent's phone, as 770-555-1234
                                          ("Call" button and schema)
    AGENT_SPANISH                         yes or no (see the shared body)
    AGENT_TERM_LINE, AGENT_COST_ANSWER    two lines of page wording (term life
                                          card, "Does it cost anything" answer)
    AGENT_BIO, _2, _3                     "Meet {First}" paragraphs, English
    AGENT_BIO_ES, _ES_2, _ES_3            the same in Spanish (Spanish on only)
  Leave a bio setting empty ("") if it is not used. No double quotes or $ in
  any value.
-->
