<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow" />
  <title>Social Media Plan | The Scheiderich Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* Layout: an app shell — a left menu of large buttons and one wide working column.
       Built for a mouse user with limited fine motor control and dyslexia:
       big, well-spaced targets; one legible typeface; plain words; icons + words for every state. */
    :root {
      color-scheme: light;
      --bg: #ffffff;          /* page (Settings can swap for a soft tint) */
      --panel: #f3f5f8;       /* quiet panels */
      --line: #cfd6df;        /* borders */
      --ink: #14213d;         /* main text */
      --ink-2: #3d4a5c;       /* secondary text (still high contrast) */
      --navy: #1e3148;        /* brand */
      --action: #b44d16;      /* main action buttons (agency orange, darkened for contrast) */
      --action-dark: #933d10;
      --focus: #1a62d6;       /* keyboard focus ring */
      --blue: #1846b8;  --blue-bg: #e7eefc;
      --amber: #7a4d00; --amber-bg: #fff1cc;
      --red: #a8231a;   --red-bg: #fde6e4;
      --green: #17663a; --green-bg: #def3e6;
      --gray: #45505f;  --gray-bg: #eceff3;
      --cp-brand: #1e3148; --cp-website: #b44d16; --cp-presence: #0d6b62; --cp-growth: #5b31ad;
      --font: 'Atkinson Hyperlegible', 'Verdana', 'Segoe UI', sans-serif;
      --r: 14px;
      --tap: 3.4rem;          /* smallest clickable height (about 61px at the default size) */
    }
    html { font-size: 112.5%; }               /* 18px — a step above normal */
    html[data-size="larger"] { font-size: 125%; }
    html[data-size="largest"] { font-size: 140%; }
    html[data-bg="warm"] { --bg: #fbf8f1; }
    html[data-bg="cool"] { --bg: #f4f8fc; }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.6; letter-spacing: .01em; }
    button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
    h1, h2, h3 { line-height: 1.25; margin: 0; text-wrap: balance; }
    h1 { font-size: 1.7rem; }
    h2 { font-size: 1.3rem; }
    p { margin: 0; }
    a { color: var(--blue); }
    :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
    svg.i { width: 1.35em; height: 1.35em; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Top bar ── */
    .top { display: flex; align-items: center; gap: 1rem; padding: .75rem max(16px, env(safe-area-inset-right, 0px)) .75rem max(16px, env(safe-area-inset-left, 0px)); border-bottom: 2px solid var(--line); background: #fff; }
    .brand { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .brand b { font-size: 1.25rem; color: var(--navy); }
    .brand span { font-size: .85rem; color: var(--ink-2); }
    .today-chip { font-weight: 700; color: var(--navy); white-space: nowrap; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; min-height: var(--tap); padding: .55rem 1.2rem; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
    .btn:hover { border-color: var(--ink-2); background: var(--panel); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-main { background: var(--action); border-color: var(--action); color: #fff; }
    .btn-main:hover { background: var(--action-dark); border-color: var(--action-dark); }
    .btn-navy { background: var(--navy); border-color: var(--navy); color: #fff; }
    .btn-navy:hover { background: #142337; border-color: #142337; }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-green:hover { background: #0f4f2c; border-color: #0f4f2c; }
    .btn-quiet { border-color: transparent; background: transparent; color: var(--blue); }
    .btn-quiet:hover { background: var(--blue-bg); border-color: transparent; }
    .btn-big { min-height: 4rem; font-size: 1.15rem; padding: .7rem 1.6rem; }
    .btn-wide { width: 100%; }
    .row { display: flex; gap: .9rem; flex-wrap: wrap; align-items: center; }

    /* ── Shell ── */
    .shell { display: grid; grid-template-columns: 15.5rem 1fr; min-height: calc(100vh - 5rem); }
    .side { border-right: 2px solid var(--line); padding: 1.25rem .9rem; display: flex; flex-direction: column; gap: .7rem; background: #fff; }
    .nav-btn { display: flex; align-items: center; gap: .8rem; width: 100%; min-height: 3.8rem; padding: .6rem 1rem; border-radius: 12px; border: 2px solid transparent; background: transparent; font-weight: 700; font-size: 1.05rem; color: var(--ink); cursor: pointer; text-align: left; }
    .nav-btn:hover { background: var(--panel); }
    .nav-btn[aria-current="page"] { background: var(--navy); color: #fff; }
    .nav-btn .badge { margin-left: auto; background: var(--action); color: #fff; border-radius: 999px; min-width: 1.8rem; padding: 0 .5rem; text-align: center; font-size: .9rem; }
    main { padding: 1.5rem max(16px, env(safe-area-inset-right, 0px)) 4rem max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
    .col { max-width: 54rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

    /* ── Message bar (stays until closed) ── */
    #msg:empty { display: none; }
    .msg { position: sticky; top: .75rem; z-index: 20; max-width: 54rem; margin: 0 auto 1.25rem; display: flex; align-items: center; gap: 1rem; padding: .8rem 1rem .8rem 1.2rem; border-radius: var(--r); border: 2px solid; font-weight: 700; flex-wrap: wrap; }
    .msg.ok { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .msg.err { background: var(--red-bg); border-color: var(--red); color: var(--red); }
    .msg.info { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
    .msg .grow { flex: 1; min-width: 12rem; }

    /* ── Cards and lists ── */
    .hero { border: 3px solid var(--navy); border-radius: 18px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: #fff; }
    .hero .label { font-weight: 700; color: var(--ink-2); }
    .hero h2 { font-size: 1.6rem; }
    .section { display: flex; flex-direction: column; gap: .8rem; }
    .section > h2 { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .count { font-size: .95rem; font-weight: 700; color: var(--ink-2); }
    .item { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 1rem; align-items: center; width: 100%; min-height: 4.6rem; padding: .85rem 1.1rem; border: 2px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer; text-align: left; }
    .item:hover { border-color: var(--navy); background: #fafbfd; }
    .item .d { font-weight: 700; }
    .item .d small { display: block; font-weight: 400; color: var(--ink-2); font-size: .85rem; }
    .item .t { font-weight: 700; font-size: 1.05rem; }
    .item .m { display: flex; gap: .5rem .9rem; flex-wrap: wrap; color: var(--ink-2); font-size: .9rem; margin-top: .2rem; align-items: center; }
    .item .go { display: flex; align-items: center; gap: .4rem; color: var(--blue); font-weight: 700; }
    .late { color: var(--red) !important; }
    .empty { padding: 1.2rem; border-radius: var(--r); background: var(--panel); color: var(--ink-2); }
    .status { display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .65rem; border-radius: 999px; font-weight: 700; font-size: .9rem; }
    .st-gray { background: var(--gray-bg); color: var(--gray); }
    .st-blue { background: var(--blue-bg); color: var(--blue); }
    .st-amber { background: var(--amber-bg); color: var(--amber); }
    .st-red { background: var(--red-bg); color: var(--red); }
    .st-green { background: var(--green-bg); color: var(--green); }
    .st-sched { background: var(--green); color: #fff; }
    .dot { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; background: var(--cp); margin-right: .1rem; }
    .where { font-weight: 700; color: var(--navy); }

    /* ── Checklist rows: the whole row is the checkbox ── */
    .task { display: grid; grid-template-columns: 2.6rem 1fr; gap: 1rem; align-items: start; width: 100%; padding: 1rem 1.1rem; border: 2px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer; text-align: left; min-height: 4.6rem; }
    .task:hover { border-color: var(--navy); }
    .box { width: 2.4rem; height: 2.4rem; border: 3px solid var(--ink-2); border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fff; }
    .task[aria-pressed="true"] .box { background: var(--green); border-color: var(--green); color: #fff; }
    .task[aria-pressed="true"] .tt { text-decoration: line-through; color: var(--ink-2); }
    .tt { font-weight: 700; font-size: 1.05rem; }
    .tm { color: var(--ink-2); font-size: .9rem; }
    .task-wrap { display: flex; flex-direction: column; gap: .4rem; }
    .task-detail { padding: .9rem 1.1rem; background: var(--panel); border-radius: var(--r); }

    /* ── Choice buttons (replace dropdowns, checkboxes and date pickers) ── */
    .choices { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); }
    .choices.wide { grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
    .choice { display: flex; align-items: flex-start; gap: .8rem; min-height: var(--tap); padding: .8rem 1rem; border: 2px solid var(--line); border-radius: var(--r); background: #fff; cursor: pointer; text-align: left; font-weight: 700; }
    .choice:hover { border-color: var(--navy); }
    .choice .tick { width: 1.8rem; height: 1.8rem; border: 3px solid var(--ink-2); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: .05rem; }
    .choice.multi .tick { border-radius: 8px; }
    .choice[aria-pressed="true"] { border-color: var(--navy); background: #eef2f8; box-shadow: inset 0 0 0 1px var(--navy); }
    .choice[aria-pressed="true"] .tick { background: var(--navy); border-color: var(--navy); color: #fff; }
    .choice small { display: block; font-weight: 400; color: var(--ink-2); font-size: .9rem; margin-top: .15rem; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: .5rem; max-width: 34rem; }
    .days .dow { text-align: center; font-weight: 700; color: var(--ink-2); font-size: .85rem; }
    .day { min-height: 3.2rem; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; cursor: pointer; }
    .day:hover { border-color: var(--navy); }
    .day[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

    /* ── Fields ── */
    .field { display: flex; flex-direction: column; gap: .45rem; }
    .field > label, .field > .q { font-weight: 700; font-size: 1.05rem; }
    .hint { color: var(--ink-2); font-size: .95rem; }
    .field input, .field textarea { width: 100%; min-height: var(--tap); padding: .7rem .9rem; border: 2px solid var(--ink-2); border-radius: 12px; background: #fff; }
    .field textarea { min-height: 7rem; resize: vertical; line-height: 1.6; }
    .field textarea.caption { min-height: 14rem; }
    .counter { font-weight: 700; color: var(--ink-2); }
    .counter.over { color: var(--red); }

    /* ── Post editor ── */
    .ed-head { display: flex; flex-direction: column; gap: .8rem; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
    .step { display: flex; align-items: center; justify-content: center; gap: .5rem; min-height: var(--tap); border: 2px solid var(--line); border-radius: 12px; background: #fff; font-weight: 700; cursor: pointer; padding: .4rem .6rem; }
    .step:hover { border-color: var(--navy); }
    .step[aria-current="step"] { background: var(--navy); border-color: var(--navy); color: #fff; }
    .step .n { width: 1.7rem; height: 1.7rem; border-radius: 50%; border: 2px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
    .step.done .n { background: var(--green); border-color: var(--green); color: #fff; }
    .panel { border: 2px solid var(--line); border-radius: 18px; padding: 1.4rem; display: flex; flex-direction: column; gap: 1.6rem; background: #fff; }
    .savebar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; color: var(--ink-2); font-weight: 700; min-height: var(--tap); }
    .savebar.err { color: var(--red); }
    .notes { padding: 1rem 1.1rem; border-radius: var(--r); background: var(--red-bg); color: var(--red); border: 2px solid var(--red); display: flex; flex-direction: column; gap: .6rem; }
    .notes p { white-space: pre-wrap; font-weight: 700; }
    .warn { padding: 1rem 1.1rem; border-radius: var(--r); background: var(--amber-bg); color: var(--amber); border: 2px solid var(--amber); font-weight: 700; }
    .caption-view { white-space: pre-wrap; padding: 1rem 1.1rem; border-radius: var(--r); background: var(--panel); font-size: 1.05rem; }
    .design { border: 2px dashed var(--line); border-radius: var(--r); background: var(--panel); aspect-ratio: 1 / 1; max-width: 26rem; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; color: var(--ink-2); }
    .design iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; }
    .design.has { border-style: solid; padding: 0; overflow: hidden; }
    .facts { display: grid; grid-template-columns: 11rem 1fr; gap: .6rem 1rem; margin: 0; }
    .facts dt { font-weight: 700; color: var(--ink-2); }
    .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .need-list { display: flex; flex-direction: column; gap: .6rem; }
    .need { display: flex; align-items: center; gap: .8rem; font-weight: 700; flex-wrap: wrap; }
    .need .ok { color: var(--green); display: inline-flex; }
    .need .no { color: var(--red); display: inline-flex; }

    /* ── Dialogs ── */
    .overlay { position: fixed; inset: 0; background: rgba(20,33,61,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
    .modal { background: #fff; border-radius: 18px; padding: 1.6rem; width: min(40rem, 100%); display: flex; flex-direction: column; gap: 1.3rem; max-height: calc(100vh - 32px); overflow-y: auto; }
    .modal .actions { display: flex; justify-content: flex-end; gap: .9rem; flex-wrap: wrap; }
    .banner { max-width: 54rem; margin: 0 auto 1rem; padding: 1rem 1.2rem; border-radius: var(--r); background: var(--red-bg); color: var(--red); border: 2px solid var(--red); font-weight: 700; }
    .loading { padding: 3rem 1rem; text-align: center; color: var(--ink-2); font-size: 1.1rem; }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .side { border-right: 0; border-bottom: 2px solid var(--line); display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); padding: .8rem 16px; }
      .item { grid-template-columns: 1fr; gap: .4rem; }
      .steps { grid-template-columns: repeat(2, 1fr); }
      .facts { grid-template-columns: 1fr; gap: .2rem; }
      .facts dd { margin-bottom: .6rem; }
      .today-chip { display: none; }
      .hide-sm { display: none; }
      .brand b { font-size: 1.1rem; }
      .brand span { white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Social Media Plan</b><span>The Scheiderich Agency</span></div>
  <div class="today-chip" id="todayChip"></div>
  <button class="btn" id="settingsBtn" type="button" aria-label="Settings: your name, text size and background"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="whoLabel">Settings</span></button>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Main menu"></nav>
  <main>
    <div id="banner"></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="view"><div class="loading">Loading your plan…</div></div>
  </main>
</div>
<div id="overlayWrap"></div>

<!-- Dashboard key + script address. This file exists ONLY on the web server: it is gitignored and must
     never be committed, because the GitHub repo is public. It sets window.SOCIAL_SCRIPT_URL and
     window.SOCIAL_SECRET. /team/ is behind Cloudflare Access, so only logged-in staff can load it. -->
<script src="/team/social-secret.js"></script>
<script>
(function () {
  'use strict';

  /* ═══════════ CONFIGURATION ═══════════
     Both values come from /team/social-secret.js, a two-line file that lives only on the server:
       window.SOCIAL_SCRIPT_URL = 'https://script.google.com/macros/s/…/exec';
       window.SOCIAL_SECRET = '…';
     The key must match DASH_KEY in the Google script's Script Properties. */
  const SCRIPT_URL = String(window.SOCIAL_SCRIPT_URL || '');
  const KEY = String(window.SOCIAL_SECRET || '');
  const PREVIEW = !!window.SOCIAL_PREVIEW;
  const LIMITS = { LinkedIn: 3000, Instagram: 2200, 'Google Business Profile': 1500 };

  /* Plain-language names shown on screen. The sheet keeps YBB's names. */
  const STATUS = {
    'Not started':        { word: 'Not started',          cls: 'st-gray',  icon: 'circle' },
    'Drafting':           { word: 'Writing',              cls: 'st-blue',  icon: 'pencil' },
    'Ready for approval': { word: 'Waiting for approval', cls: 'st-amber', icon: 'clock' },
    'Changes requested':  { word: 'Needs changes',        cls: 'st-red',   icon: 'alert' },
    'Approved':           { word: 'Approved',             cls: 'st-green', icon: 'check' },
    'Scheduled':          { word: 'Scheduled',            cls: 'st-sched', icon: 'calendar' },
    'Skipped':            { word: 'Skipped',              cls: 'st-gray',  icon: 'minus' }
  };
  const JOBS = {
    Brand:    { plain: 'Who we are',                 about: 'Our team, our story, why we are different',       color: 'var(--cp-brand)' },
    Website:  { plain: 'Send people to our website', about: 'A service, a quote page, a blog post or resource', color: 'var(--cp-website)' },
    Presence: { plain: 'Teach something useful',     about: 'Tips, how-tos, answers to common questions',       color: 'var(--cp-presence)' },
    Growth:   { plain: 'Build trust',                about: 'Reviews, results, referrals, events and offers',   color: 'var(--cp-growth)' }
  };
  const GROUP = { LinkedIn: 'LinkedIn', 'All Socials': 'Facebook, Instagram, Google' };

  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    list: '<path d="M10 6h11M10 12h11M10 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
    gift: '<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    circle: '<circle cx="12" cy="12" r="8"/>',
    pencil: '<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',
    minus: '<path d="M6 12h12"/>',
    arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    arrowL: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    speaker: '<path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
    undo: '<path d="M9 5L4 10l5 5"/><path d="M4 10h10a6 6 0 0 1 0 12h-3"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    approve: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
    open: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    paste: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>'
  };
  function icon(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }

  /* ═══════════ STATE ═══════════ */
  let D = null;
  let view = 'today';
  let monthShown = null;
  let groupFilter = 'All';
  let checklistMonth = null;
  const openDetail = {};
  let ed = null;            // post editor state
  const SPEAK = {};         // read-aloud text by button id, filled while rendering
  const prefs = { who: '', size: 'normal', bg: 'white', speak: 'on' };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('socialPrefs') || '{}')); } catch (e) {}
  function savePrefs() { try { localStorage.setItem('socialPrefs', JSON.stringify(prefs)); } catch (e) {} applyPrefs(); }
  function applyPrefs() {
    const h = document.documentElement;
    if (prefs.size === 'normal') h.removeAttribute('data-size'); else h.setAttribute('data-size', prefs.size);
    if (prefs.bg === 'white') h.removeAttribute('data-bg'); else h.setAttribute('data-bg', prefs.bg);
  }
  applyPrefs();

  /* ═══════════ DATA LAYER ═══════════
     Reads and short changes go through a <script> tag (JSONP) — a plain fetch against Apps Script fails on this site.
     A whole post can be too long for a web address, so it is POSTed, and the page then reads that post back
     to confirm the save landed (a POST's answer can't be read from the browser). */
  function jsonp(params) {
    return new Promise(function (resolve, reject) {
      const cb = 'socialcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      const s = document.createElement('script');
      let timer = null;
      function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
      window[cb] = function (data) { cleanup(); resolve(data); };
      const q = Object.assign({}, params, { k: KEY, callback: cb, t: Date.now() });
      s.src = SCRIPT_URL + '?' + Object.keys(q).filter(function (k) { return q[k] !== undefined && q[k] !== null; })
        .map(function (k) { const v = typeof q[k] === 'object' ? JSON.stringify(q[k]) : q[k]; return encodeURIComponent(k) + '=' + encodeURIComponent(v); }).join('&');
      s.onerror = function () { cleanup(); reject(new Error('Could not reach the Google sheet. Check the internet connection and try again.')); };
      timer = setTimeout(function () { cleanup(); reject(new Error('The Google sheet took too long to answer. Try again.')); }, 25000);
      document.head.appendChild(s);
    });
  }
  function local(params) {
    return new Promise(function (resolve) {
      setTimeout(function () { resolve(JSON.parse(JSON.stringify(window.handleRequest(Object.assign({}, params, { k: window.PREVIEW_KEY }))))); }, 150);
    });
  }
  function call(params) {
    return (PREVIEW ? local(params) : jsonp(params)).then(function (r) {
      if (r && r.success === false) {
        if (r.error === 'unauthorized') throw new Error('The dashboard key was not accepted. Reload the page. If it keeps happening, tell Mike.');
        throw new Error(r.error || 'Something went wrong. Try again.');
      }
      return r;
    });
  }
  function postLong(params) {
    if (PREVIEW) return call(params);
    return fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({}, params, { k: KEY })) })
      .then(function () { return { success: true, unconfirmed: true }; });
  }
  function load() {
    return call({ action: 'all' }).then(function (r) { D = r; if (!monthShown) monthShown = defaultMonth(); render(); return r; })
      .catch(function (e) { $('#banner').innerHTML = '<div class="banner">' + esc(e.message) + '</div>'; $('#view').innerHTML = ''; throw e; });
  }
  function replacePost(p) { const i = D.posts.findIndex(function (x) { return x.id === p.id; }); if (i >= 0) D.posts[i] = p; else D.posts.push(p); }

  /* ═══════════ HELPERS ═══════════ */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function isoDate(iso) { const a = iso.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2] || 1)); }
  function fmt(iso) { if (!iso) return 'No date yet'; const d = isoDate(iso); return DOW[d.getUTCDay()].slice(0, 3) + ', ' + MONTHS[d.getUTCMonth()].slice(0, 3) + ' ' + d.getUTCDate(); }
  function fmtLong(iso) { if (!iso) return 'No date yet'; const d = isoDate(iso); return DOW[d.getUTCDay()] + ', ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
  function monthName(ym) { return MONTHS[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4); }
  function monthOnly(ym) { return MONTHS[Number(ym.slice(5, 7)) - 1]; }
  function addDays(iso, n) { const d = isoDate(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function addMonths(ym, n) { const d = isoDate(ym + '-01'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); }
  function lastDay(ym) { return addDays(addMonths(ym, 1) + '-01', -1); }
  function daysFrom(a, b) { return Math.round((isoDate(b) - isoDate(a)) / 86400000); }
  function when(due) {
    if (!due) return '';
    const n = daysFrom(D.today, due);
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return '1 day late';
    if (n < 0) return (-n) + ' days late';
    return 'in ' + n + ' days';
  }
  function split(s) { return String(s || '').split(/\s*[,;]\s*/).filter(Boolean); }
  function personName(n) { return String(n).split(' — ')[0]; }
  function personRole(n) { return String(n).split(' — ')[1] || ''; }
  function isApprover() { return !!D && D.lists.approvers.indexOf(prefs.who) >= 0; }
  function first(name) { return String(name || '').split(' ')[0]; }
  function postById(id) { return D.posts.filter(function (p) { return p.id === id; })[0]; }
  function hasGbp(p) { return split(p.channels).indexOf('Google Business Profile') >= 0; }
  function onlyGbp(p) { const c = split(p.channels); return c.length === 1 && c[0] === 'Google Business Profile'; }
  function title(p) { return p.topic || (p.kind === 'Regular' ? 'New post: ' + (JOBS[p.checkpoint] ? JOBS[p.checkpoint].plain.toLowerCase() : 'topic not chosen') : p.kind + ' post'); }
  function statusBadge(s) { const m = STATUS[s] || STATUS['Not started']; return '<span class="status ' + m.cls + '">' + icon(m.icon) + esc(m.word) + '</span>'; }
  function defaultMonth() {
    const thisM = D.today.slice(0, 7);
    if (D.builtMonths.indexOf(thisM) >= 0) return thisM;
    return D.builtMonths.filter(function (m) { return m >= thisM; })[0] || thisM;
  }
  function speakBtn(id, label) {
    if (prefs.speak !== 'on' || !('speechSynthesis' in window)) return '';
    return '<button class="btn btn-quiet" type="button" data-speak="' + esc(id) + '">' + icon('speaker') + esc(label || 'Read aloud') + '</button>';
  }
  let speakingBtn = null;
  function speak(text, btn) {
    if (!('speechSynthesis' in window) || !text) return;
    const synth = window.speechSynthesis;
    if (speakingBtn === btn && synth.speaking) { synth.cancel(); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92; u.lang = 'en-US';
    const label = btn.innerHTML;
    speakingBtn = btn;
    btn.innerHTML = icon('stop') + 'Stop reading';
    u.onend = u.onerror = function () { btn.innerHTML = label; if (speakingBtn === btn) speakingBtn = null; };
    synth.speak(u);
  }

  // The one next step for a post.
  function nextStep(p) {
    switch (p.status) {
      case 'Not started': case 'Drafting': return { type: 'draft', label: 'Write and design this post', due: p.draftDue };
      case 'Changes requested': return { type: 'changes', label: 'Fix what was asked', due: p.draftDue && p.draftDue < D.today ? p.draftDue : D.today };
      case 'Ready for approval': return { type: 'waiting', label: 'Waiting for approval', due: p.approvalDue };
      case 'Approved': if (onlyGbp(p)) return p.gbpPosted ? null : { type: 'gbp', label: 'Post it on Google', due: p.date };
        return { type: 'schedule', label: 'Schedule it in Canva', due: p.scheduleDue };
      case 'Scheduled': return hasGbp(p) && !p.gbpPosted ? { type: 'gbp', label: 'Post it on Google', due: p.date } : null;
    }
    return null;
  }

  /* Keep keyboard focus (and the cursor in a text box) where it was when the screen redraws. */
  function focusKey(el) {
    if (!el || el === document.body || !el.closest('#view, #nav, #msg')) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    const k = Object.keys(el.dataset)[0];
    if (!k) return null;
    return '[data-' + k.replace(/[A-Z]/g, function (m) { return '-' + m.toLowerCase(); }) + '="' + CSS.escape(el.dataset[k]) + '"]';
  }

  /* ═══════════ MESSAGES (stay until closed) ═══════════ */
  let undoFn = null;
  function showMsg(text, kind, undo) {
    undoFn = undo || null;
    $('#msg').innerHTML = '<div class="msg ' + (kind || 'ok') + '">' + icon(kind === 'err' ? 'alert' : 'check') +
      '<span class="grow">' + esc(text) + '</span>' +
      (undo ? '<button class="btn" type="button" data-undo="1">' + icon('undo') + 'Undo</button>' : '') +
      '<button class="btn btn-quiet" type="button" data-closemsg="1">' + icon('x') + 'Close</button></div>';
  }
  function clearMsg() { $('#msg').innerHTML = ''; undoFn = null; }

  /* ═══════════ RENDER ═══════════ */
  function render() {
    const a = document.activeElement;
    const key = focusKey(a);
    const caret = a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') ? [a.selectionStart, a.selectionEnd] : null;
    $('#todayChip').textContent = fmtLong(D.today);
    $('#whoLabel').innerHTML = prefs.who ? esc(first(prefs.who)) + '<span class="hide-sm"> · Settings</span>' : 'Settings';
    renderNav();
    if (view === 'post' && ed) renderEditor();
    else if (view === 'calendar') renderCalendar();
    else if (view === 'approvals' && isApprover()) renderApprovals();
    else if (view === 'checklist') renderChecklist();
    else if (view === 'holidays') renderHolidays();
    else { view = 'today'; renderToday(); }
    if (key) { const el = $(key); if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange) { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) {} } } }
  }

  function renderNav() {
    const waiting = D.posts.filter(function (p) { return p.status === 'Ready for approval'; }).length;
    const items = [['today', 'sun', 'Today'], ['calendar', 'calendar', 'Calendar']];
    if (isApprover()) items.push(['approvals', 'approve', 'Approvals']);
    items.push(['checklist', 'list', 'Checklist'], ['holidays', 'gift', 'Holidays']);
    const cur = view === 'post' ? (ed && ed.from) || 'today' : view;
    $('#nav').innerHTML = items.map(function (it) {
      return '<button class="nav-btn" type="button" data-view="' + it[0] + '"' + (cur === it[0] ? ' aria-current="page"' : '') + '>' + icon(it[1]) + it[2] +
        (it[0] === 'approvals' && waiting ? '<span class="badge"><span aria-hidden="true">' + waiting + '</span><span style="position:absolute;left:-9999px">, ' + waiting + ' waiting</span></span>' : '') + '</button>';
    }).join('');
  }
  function setView(html) { $('#view').innerHTML = '<div class="col">' + html + '</div>'; }

  function itemRow(p, step) {
    const late = step && step.due && step.due < D.today && step.type !== 'waiting';
    const job = JOBS[p.checkpoint];
    return '<button class="item" type="button" data-open="' + esc(p.id) + '">' +
      '<div class="d">' + esc(fmt(p.date)) + '<small>Post day</small></div>' +
      '<div><div class="t">' + esc(title(p)) + '</div><div class="m">' +
        '<span class="where">' + esc(GROUP[p.group]) + '</span>' +
        (job ? '<span><span class="dot" style="--cp:' + job.color + '"></span> ' + esc(job.plain) + '</span>' : '') +
        statusBadge(p.status) + '</div></div>' +
      '<div class="go' + (late ? ' late' : '') + '">' + (step && step.type !== 'waiting' ? esc(step.label) + ' · ' + esc(when(step.due)) : 'Open') + icon('arrowR') + '</div></button>';
  }

  function taskRow(t) {
    const late = !t.done && t.due < D.today;
    const open = openDetail[t.id];
    SPEAK['task-' + t.id] = t.title + '. ' + (t.detail || '');
    return '<div class="task-wrap"><button class="task" type="button" data-task="' + esc(t.id) + '" aria-pressed="' + t.done + '">' +
      '<span class="box" aria-hidden="true">' + (t.done ? icon('check') : '') + '</span>' +
      '<span><span class="tt">' + esc(t.title) + '</span><br><span class="tm' + (late ? ' late' : '') + '">' +
        (t.done ? 'Done by ' + esc(first(t.doneBy)) : 'Due ' + esc(fmt(t.due)) + ' · ' + esc(when(t.due))) + '</span></span></button>' +
      (t.detail ? '<div class="row"><button class="btn btn-quiet" type="button" data-detail="' + esc(t.id) + '" aria-expanded="' + !!open + '">' + (open ? 'Hide the steps' : 'Show the steps') + '</button>' + speakBtn('task-' + t.id) + '</div>' : '') +
      (open ? '<div class="task-detail">' + esc(t.detail) + '</div>' : '') + '</div>';
  }

  function queue() {
    const out = [];
    D.posts.forEach(function (p) { const s = nextStep(p); if (s && s.type !== 'waiting' && p.date) out.push([p, s]); });
    out.sort(function (a, b) { return a[1].due.localeCompare(b[1].due) || a[0].date.localeCompare(b[0].date); });
    return out;
  }

  function renderToday() {
    const week = addDays(D.today, 7);
    const q = queue();
    const dueNow = q.filter(function (x) { return x[1].due <= D.today; });
    const soon = q.filter(function (x) { return x[1].due > D.today && x[1].due <= week; });
    const tasks = D.tasks.filter(function (t) { return !t.done && t.due <= week; }).sort(function (a, b) { return a.due.localeCompare(b.due); });
    const waiting = D.posts.filter(function (p) { return p.status === 'Ready for approval'; });
    let h = '<h1>' + (prefs.who ? 'Hi ' + esc(first(prefs.who)) + '. ' : '') + 'Here is today.</h1>';

    if (isApprover() && waiting.length) {
      h += '<div class="hero"><span class="label">For you</span><h2>' + waiting.length + (waiting.length === 1 ? ' post is' : ' posts are') + ' waiting for your approval</h2>' +
        '<div class="row"><button class="btn btn-main btn-big" type="button" data-view="approvals">Review them' + icon('arrowR') + '</button></div></div>';
    }
    const next = dueNow[0] || soon[0];
    const nextTask = tasks[0];
    if (next) {
      const p = next[0], s = next[1];
      SPEAK.hero = 'Do this next. ' + s.label + ': ' + title(p) + '. Due ' + fmtLong(s.due) + ', ' + when(s.due) + '. It posts on ' + fmtLong(p.date) + '.';
      h += '<div class="hero"><span class="label">Do this next</span><h2>' + esc(s.label) + ': ' + esc(title(p)) + '</h2>' +
        '<p class="' + (s.due < D.today ? 'late' : '') + '"><b>Due ' + esc(fmtLong(s.due)) + '</b> (' + esc(when(s.due)) + '). It posts on ' + esc(fmtLong(p.date)) + ' on ' + esc(GROUP[p.group]) + '.</p>' +
        '<div class="row"><button class="btn btn-main btn-big" type="button" data-open="' + esc(p.id) + '">Start' + icon('arrowR') + '</button>' + speakBtn('hero') + '</div></div>';
    } else if (nextTask) {
      h += '<div class="hero"><span class="label">Do this next</span><h2>' + esc(nextTask.title) + '</h2><p>Due ' + esc(fmtLong(nextTask.due)) + ' (' + esc(when(nextTask.due)) + ').</p>' +
        '<div class="row"><button class="btn btn-main btn-big" type="button" data-view="checklist">Open the checklist' + icon('arrowR') + '</button></div></div>';
    } else {
      h += '<div class="hero"><span class="label">All caught up</span><h2>Nothing is due right now.</h2><p>You can work ahead from the Calendar.</p>' +
        '<div class="row"><button class="btn btn-navy btn-big" type="button" data-view="calendar">Open the calendar' + icon('arrowR') + '</button></div></div>';
    }
    if (tasks.length) h += '<section class="section"><h2>Checklist <span class="count">' + tasks.length + ' to do</span></h2>' + tasks.map(taskRow).join('') + '</section>';
    const rest = dueNow.filter(function (x) { return x !== next; });
    h += '<section class="section"><h2>Also due now <span class="count">' + rest.length + '</span></h2>' + (rest.length ? rest.map(function (x) { return itemRow(x[0], x[1]); }).join('') : '<p class="empty">Nothing else is due today.</p>') + '</section>';
    const soonRest = soon.filter(function (x) { return x !== next; });
    h += '<section class="section"><h2>Coming up this week <span class="count">' + soonRest.length + '</span></h2>' + (soonRest.length ? soonRest.map(function (x) { return itemRow(x[0], x[1]); }).join('') : '<p class="empty">Nothing else this week.</p>') + '</section>';
    h += '<section class="section"><h2>Waiting for approval <span class="count">' + waiting.length + '</span></h2>' +
      (waiting.length ? waiting.map(function (p) { return itemRow(p, nextStep(p)); }).join('') : '<p class="empty">Nothing is waiting on Mike, Crissy or Wendy.</p>') + '</section>';
    setView(h);
  }

  function renderCalendar() {
    const m = monthShown;
    const built = D.builtMonths.indexOf(m) >= 0;
    let posts = D.posts.filter(function (p) { return p.month === m; });
    if (groupFilter !== 'All') posts = posts.filter(function (p) { return p.group === groupFilter; });
    posts.sort(function (a, b) { return (a.date || '9999').localeCompare(b.date || '9999') || a.group.localeCompare(b.group); });
    let h = '<div class="row" style="justify-content:space-between">' +
      '<button class="btn" type="button" data-month="-1">' + icon('arrowL') + monthOnly(addMonths(m, -1)) + '</button>' +
      '<h1>' + esc(monthName(m)) + '</h1>' +
      '<button class="btn" type="button" data-month="1">' + monthOnly(addMonths(m, 1)) + icon('arrowR') + '</button></div>';
    if (!built) {
      setView(h + '<div class="hero"><h2>' + esc(monthName(m)) + ' is not set up yet</h2><p>Setting it up adds the LinkedIn posts, the Facebook, Instagram and Google posts, the checklist, and posts for any holidays you chose.</p>' +
        '<div class="row"><button class="btn btn-main btn-big" type="button" data-build="' + m + '">Set up ' + esc(monthOnly(m)) + '</button></div></div>');
      return;
    }
    h += '<div class="choices" role="group" aria-label="Which posts to show">' + [['All', 'Show everything'], ['LinkedIn', 'LinkedIn only'], ['All Socials', 'Facebook, Instagram, Google only']].map(function (g) {
      return '<button class="choice" type="button" data-filter="' + g[0] + '" aria-pressed="' + (groupFilter === g[0]) + '"><span class="tick" aria-hidden="true">' + (groupFilter === g[0] ? icon('check') : '') + '</span>' + g[1] + '</button>'; }).join('') + '</div>';
    h += '<div class="row"><button class="btn btn-navy" type="button" data-add="1">' + icon('plus') + 'Add a post</button></div>';
    const weeks = {};
    posts.forEach(function (p) { const w = p.week || '?'; (weeks[w] = weeks[w] || []).push(p); });
    Object.keys(weeks).sort().forEach(function (w) {
      const ps = weeks[w];
      const done = ps.filter(function (p) { return p.status === 'Scheduled' || p.status === 'Skipped'; }).length;
      h += '<section class="section"><h2>' + (w === '?' ? 'No date yet' : 'Week ' + esc(w)) + ' <span class="count">' + done + ' of ' + ps.length + ' scheduled</span></h2>' +
        ps.map(function (p) { return itemRow(p, nextStep(p)); }).join('') + '</section>';
    });
    if (!posts.length) h += '<p class="empty">No posts to show.</p>';
    setView(h);
  }

  function renderApprovals() {
    const ready = D.posts.filter(function (p) { return p.status === 'Ready for approval'; }).sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
    let h = '<h1>Approvals</h1><p>Approve each post on its own: the words and the design together.</p>';
    if (!ready.length) { setView(h + '<p class="empty">Nothing is waiting for approval.</p>'); return; }
    h += ready.map(function (p) {
      SPEAK['cap-' + p.id] = p.caption;
      return '<div class="panel"><div class="row"><span class="where">' + esc(GROUP[p.group]) + '</span><b>Posts ' + esc(fmtLong(p.date)) + '</b>' +
        (p.approvalDue ? '<span class="' + (p.approvalDue < D.today ? 'late' : '') + '">Approve by ' + esc(fmt(p.approvalDue)) + '</span>' : '') + '</div>' +
        '<h2>' + esc(title(p)) + '</h2>' + (p.changeNotes ? '<div class="notes"><b>History</b><p>' + esc(p.changeNotes) + '</p></div>' : '') +
        designBox(p) + '<div class="caption-view">' + esc(p.caption) + '</div><div class="row">' + speakBtn('cap-' + p.id, 'Read the words aloud') + '</div>' + factsList(p) +
        '<div class="row"><button class="btn btn-green btn-big" type="button" data-approve="' + esc(p.id) + '">' + icon('approve') + 'Approve</button>' +
        '<button class="btn btn-big" type="button" data-changes="' + esc(p.id) + '">' + icon('pencil') + 'Needs changes</button></div></div>';
    }).join('');
    setView(h);
  }

  function renderChecklist() {
    const months = Array.from(new Set(D.tasks.map(function (t) { return t.month; }))).sort();
    if (!checklistMonth || months.indexOf(checklistMonth) < 0) {
      checklistMonth = months.filter(function (m) { return D.tasks.some(function (t) { return t.month === m && !t.done; }); })[0] || months[months.length - 1] || D.today.slice(0, 7);
    }
    const tasks = D.tasks.filter(function (t) { return t.month === checklistMonth; }).sort(function (a, b) { return a.due.localeCompare(b.due); });
    const done = tasks.filter(function (t) { return t.done; }).length;
    let h = '<h1>Monthly checklist</h1><p>The steps to plan each month. Check them off any time. Doing them early is fine.</p>';
    if (months.length > 1) h += '<div class="choices" role="group" aria-label="Which month">' + months.map(function (m) {
      return '<button class="choice" type="button" data-clmonth="' + m + '" aria-pressed="' + (m === checklistMonth) + '"><span class="tick" aria-hidden="true">' + (m === checklistMonth ? icon('check') : '') + '</span>Planning ' + esc(monthName(m)) + '</button>'; }).join('') + '</div>';
    h += '<section class="section"><h2>Planning ' + esc(monthName(checklistMonth)) + ' <span class="count">' + done + ' of ' + tasks.length + ' done</span></h2>' +
      (tasks.length ? tasks.map(taskRow).join('') : '<p class="empty">No checklist yet. Set up the month on the Calendar.</p>') + '</section>';
    h += '<section class="section"><h2>Add your own task</h2><div class="field"><label for="newTask">What needs doing?</label><input id="newTask" type="text" spellcheck="true"></div>' +
      '<div class="field"><span class="q">Which day is it due?</span>' + dayGrid(D.today.slice(0, 7), 'newtaskday', null) + '</div>' +
      '<div class="row"><button class="btn btn-navy" type="button" data-addtask="1">' + icon('plus') + 'Add task</button></div></section>';
    setView(h);
  }

  function renderHolidays() {
    const from = D.today.slice(0, 7);
    const months = Array.from(new Set(D.holidays.map(function (x) { return x.month; }))).filter(function (m) { return m >= from; }).sort().slice(0, 4);
    let h = '<h1>Holidays</h1><p>Choose which holidays get a post. Holiday posts are extra, on top of the regular posts. This shows the next four months.</p>';
    months.forEach(function (m) {
      const rows = D.holidays.filter(function (x) { return x.month === m; });
      const yes = rows.filter(function (x) { return x.use === 'Yes'; }).length;
      h += '<section class="section"><h2>' + esc(monthName(m)) + ' <span class="count">' + yes + ' chosen</span></h2>' +
        rows.map(function (x) {
          SPEAK['hol-' + x.id] = x.name + '. ' + x.when + '. Idea: ' + x.idea;
          const where = x.channel === 'All Socials' ? GROUP['All Socials'] : x.channel === 'Both' ? 'All channels' : x.channel;
          return '<div class="panel" style="gap:.9rem;padding:1.1rem"><div><b>' + esc(x.name) + '</b><div class="hint">' + esc(x.when) + ' · ' + esc(where) + '</div><p class="hint" style="margin-top:.3rem">Idea: ' + esc(x.idea) + '</p></div>' +
            '<div class="row">' + [['Yes', 'Use it'], ['No', 'Skip it']].map(function (v) {
              return '<button class="choice" type="button" style="min-width:9rem" data-hol="' + esc(x.id) + '" data-v="' + v[0] + '" aria-pressed="' + (x.use === v[0]) + '"><span class="tick" aria-hidden="true">' + (x.use === v[0] ? icon('check') : '') + '</span>' + v[1] + '</button>'; }).join('') +
            (!x.start ? '<button class="btn" type="button" data-holdate="' + esc(x.id) + '">' + icon('calendar') + 'Pick the date</button>' : '') + speakBtn('hol-' + x.id) + '</div></div>';
        }).join('') +
        '<div class="row"><button class="btn btn-main" type="button" data-addhol="' + m + '"' + (yes ? '' : ' disabled') + '>Add the chosen holidays to ' + esc(monthOnly(m)) + '</button></div></section>';
    });
    setView(h);
  }

  /* ═══════════ PIECES ═══════════ */
  function dayGrid(ym, key, selected) {
    const lead = (isoDate(ym + '-01').getUTCDay() + 6) % 7; // weeks start on Monday
    const n = Number(lastDay(ym).slice(8));
    let h = '<div class="days" role="group" aria-label="Days in ' + esc(monthName(ym)) + '">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) { return '<span class="dow" aria-hidden="true">' + d + '</span>'; }).join('');
    for (let i = 0; i < lead; i++) h += '<span></span>';
    for (let d = 1; d <= n; d++) {
      const iso = ym + '-' + ('0' + d).slice(-2);
      h += '<button class="day" type="button" data-' + key + '="' + iso + '" aria-pressed="' + (iso === selected) + '" aria-label="' + esc(fmtLong(iso)) + '">' + d + '</button>';
    }
    return h + '</div>';
  }
  function embedUrl(link) {
    const m = String(link || '').match(/canva\.com\/design\/([A-Za-z0-9_-]+)/);
    return m ? 'https://www.canva.com/design/' + m[1] + '/view?embed' : '';
  }
  function designBox(p) {
    if (!p.canva) return '<div class="design">No design link yet</div>';
    const url = embedUrl(p.canva);
    let h = PREVIEW
      ? '<div class="design">The Canva design shows here on the real dashboard.</div>'
      : (url ? '<div class="design has"><iframe src="' + esc(url) + '" title="Canva design for ' + esc(title(p)) + '" loading="lazy" allowfullscreen></iframe></div>' : '<div class="design">This is not a Canva design link.</div>');
    return h + '<div class="row"><a class="btn" href="' + esc(p.canva) + '" target="_blank" rel="noopener">' + icon('open') + 'Open the design in Canva</a></div>';
  }
  function factsList(p) {
    const ps = split(p.personas).map(function (n) { return personName(n) + ' (' + personRole(n).replace(/^The /, '').toLowerCase() + ')'; }).join(', ');
    return '<dl class="facts">' +
      '<dt>For</dt><dd>' + esc(ps || 'Not chosen yet') + '</dd>' +
      '<dt>Job</dt><dd>' + esc(JOBS[p.checkpoint] ? JOBS[p.checkpoint].plain + ' (' + p.checkpoint + ')' : 'Not chosen yet') + '</dd>' +
      '<dt>Kind</dt><dd>' + esc(p.contentType || 'Not chosen yet') + (p.format ? ', ' + esc(p.format) : '') + '</dd>' +
      '<dt>Where</dt><dd>' + esc(p.channels || 'Not chosen yet') + '</dd>' +
      (p.cta ? '<dt>Asks people to</dt><dd>' + esc(p.cta) + '</dd>' : '') +
      (p.link ? '<dt>Link</dt><dd><a href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.link) + '</a></dd>' : '') + '</dl>';
  }

  /* ═══════════ POST EDITOR ═══════════ */
  const FIELDS = ['date', 'checkpoint', 'personas', 'contentType', 'format', 'channels', 'topic', 'message', 'cta', 'link', 'caption', 'canva', 'assetNotes', 'needs'];
  const EDITABLE_STATUS = ['Not started', 'Drafting', 'Changes requested'];
  const STEP_NAMES = ['Plan', 'Write', 'Design', 'Send'];
  function openPost(id, from) {
    const p = postById(id); if (!p) return;
    const vals = {}; FIELDS.forEach(function (k) { vals[k] = p[k] || ''; });
    const step = !p.checkpoint || !p.personas || !p.contentType ? 1 : !p.caption ? 2 : !p.canva ? 3 : 4;
    ed = { id: id, step: p.status === 'Changes requested' ? 2 : step, editing: false, vals: vals, saved: 'idle', timer: null, lastUndo: null, from: from || 'today' };
    view = 'post'; clearMsg(); render(); window.scrollTo(0, 0);
    setTimeout(function () { const b = $('#edBack'); if (b) b.focus({ preventScroll: true }); }, 30);
  }
  function closePost() { flushSave().then(function () { view = ed ? ed.from : 'today'; ed = null; render(); window.scrollTo(0, 0); }); }
  function isEditing(p) { return EDITABLE_STATUS.indexOf(p.status) >= 0 || (ed && ed.editing); }
  function stepDone(n, v) {
    if (n === 1) return !!(v.date && v.checkpoint && v.personas && v.contentType);
    if (n === 2) return !!String(v.caption).trim();
    if (n === 3) return !!(v.canva && v.channels);
    return false;
  }

  function renderEditor() {
    const p = postById(ed.id); if (!p) { view = 'today'; ed = null; render(); return; }
    const v = ed.vals;
    let h = '<div class="ed-head"><div class="row"><button class="btn" type="button" id="edBack" data-closepost="1">' + icon('arrowL') + 'Back to ' + esc({ today: 'Today', calendar: 'Calendar', approvals: 'Approvals', checklist: 'Checklist', holidays: 'Holidays' }[ed.from] || 'Today') + '</button></div>' +
      '<div class="row"><span class="where">' + esc(GROUP[p.group]) + '</span>' + statusBadge(p.status) + '<span>Posts <b>' + esc(fmtLong(v.date)) + '</b></span>' + (p.kind !== 'Regular' ? '<span class="status st-gray">' + esc(p.kind) + '</span>' : '') + '</div>' +
      '<h1>' + esc(v.topic || title(p)) + '</h1></div>';
    if (p.changeNotes && (p.status === 'Changes requested' || p.status === 'Ready for approval')) {
      SPEAK.notes = p.changeNotes;
      h += '<div class="notes"><b>' + (p.status === 'Changes requested' ? 'What needs to change' : 'Notes') + '</b><p>' + esc(p.changeNotes) + '</p><div class="row">' + speakBtn('notes') + '</div></div>';
    }
    h += isEditing(p) ? editorSteps(p, v) : editorSummary(p);
    setView(h);
    wireEditor();
  }

  function editorSteps(p, v) {
    let h = '';
    if (ed.editing && (p.status === 'Approved' || p.status === 'Scheduled' || p.status === 'Ready for approval')) {
      h += '<div class="warn">You are changing a post that was already approved. As soon as a change saves, it goes back to Mike, Crissy or Wendy for approval.' + (p.status === 'Scheduled' ? ' It is scheduled in Canva, so pause or update it there too.' : '') + '</div>';
    }
    h += '<nav class="steps" aria-label="Steps">' + STEP_NAMES.map(function (n, i) {
      const k = i + 1, done = stepDone(k, v);
      return '<button class="step' + (done ? ' done' : '') + '" type="button" data-step="' + k + '"' + (ed.step === k ? ' aria-current="step"' : '') + '><span class="n" aria-hidden="true">' + (done ? icon('check') : k) + '</span>' + n + (done ? '<span style="position:absolute;left:-9999px"> (done)</span>' : '') + '</button>';
    }).join('') + '</nav>';
    h += '<div class="panel">' + [step1, step2, step3, step4][ed.step - 1](p, v) +
      '<div class="row" style="justify-content:space-between">' +
      (ed.step > 1 ? '<button class="btn btn-big" type="button" data-step="' + (ed.step - 1) + '">' + icon('arrowL') + 'Back: ' + STEP_NAMES[ed.step - 2] + '</button>' : '<span></span>') +
      (ed.step < 4 ? '<button class="btn btn-navy btn-big" type="button" data-step="' + (ed.step + 1) + '">Next: ' + STEP_NAMES[ed.step] + icon('arrowR') + '</button>' : '') + '</div></div>';
    h += '<div class="savebar" id="savebar" aria-live="polite"></div>';
    h += '<div class="row">' + (p.kind === 'Regular' ? '<button class="btn btn-quiet" type="button" data-skip="' + esc(p.id) + '">Skip this post this month</button>' : '<button class="btn btn-quiet" type="button" data-delpost="' + esc(p.id) + '">Delete this post</button>') + '</div>';
    return h;
  }

  function step1(p, v) {
    const isLI = p.group === 'LinkedIn';
    const people = D.lists.personas.filter(function (x) { return x.type === (isLI ? 'B2B' : 'B2C'); });
    const chosen = split(v.personas);
    return '<div class="field"><span class="q">Which day does it post?</span><span class="hint">Chosen: <b>' + esc(fmtLong(v.date)) + '</b></span>' + dayGrid(p.month, 'pickday', v.date) + '</div>' +
      '<div class="field"><span class="q">Who is it for?</span><span class="hint">' + (isLI ? 'LinkedIn is for our referral partners.' : 'Facebook, Instagram and Google are for our customers.') + ' You can pick both.</span>' +
      '<div class="choices wide">' + people.map(function (x) {
        const on = chosen.indexOf(x.name) >= 0;
        return '<button class="choice multi" type="button" data-toggle="personas" data-val="' + esc(x.name) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span><span>' + esc(personName(x.name)) + '<small>' + esc(personRole(x.name)) + '</small></span></button>'; }).join('') + '</div></div>' +
      '<div class="field"><span class="q">What is this post\'s job?</span><div class="choices wide">' + D.lists.checkpoints.map(function (c) {
        const j = JOBS[c.name] || { plain: c.name, about: '', color: 'var(--navy)' }; const on = v.checkpoint === c.name;
        return '<button class="choice" type="button" data-set="checkpoint" data-val="' + esc(c.name) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span><span><span class="dot" style="--cp:' + j.color + '"></span> ' + esc(j.plain) + '<small>' + esc(j.about) + ' · YBB: ' + esc(c.name) + '</small></span></button>'; }).join('') + '</div></div>' +
      '<div class="field"><span class="q">What kind of post is it?</span><div class="choices">' + D.lists.contentTypes.map(function (c) {
        const on = v.contentType === c;
        return '<button class="choice" type="button" data-set="contentType" data-val="' + esc(c) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' + esc(c) + '</button>'; }).join('') + '</div></div>';
  }

  function capLimit(channels) {
    const chans = split(channels);
    const lim = chans.map(function (c) { return LIMITS[c]; }).filter(Boolean);
    const max = lim.length ? Math.min.apply(null, lim) : 0;
    return { max: max, who: chans.filter(function (c) { return LIMITS[c] === max; }).map(function (c) { return c === 'Google Business Profile' ? 'Google' : c; }).join(' and ') };
  }
  function capText(n, channels) {
    const l = capLimit(channels);
    if (!l.max) return n + ' letters';
    return n > l.max ? n + ' letters. That is ' + (n - l.max) + ' too many for ' + l.who + '.' : n + ' of ' + l.max.toLocaleString() + ' letters allowed on ' + l.who;
  }
  function step2(p, v) {
    const l = capLimit(v.channels);
    SPEAK.caption = v.caption;
    return '<div class="field"><label for="f-topic">What is the post about? (a short title)</label><input id="f-topic" data-f="topic" type="text" spellcheck="true" value="' + esc(v.topic) + '"></div>' +
      '<div class="field"><label for="f-message">The main point, in one sentence</label><textarea id="f-message" data-f="message" spellcheck="true">' + esc(v.message) + '</textarea></div>' +
      '<div class="field"><label for="f-caption">The words for the post</label><span class="hint" id="capHint">Write it exactly the way it will be posted. Spelling mistakes are underlined in red.</span>' +
        '<textarea id="f-caption" class="caption" data-f="caption" spellcheck="true" lang="en-US" aria-describedby="capHint capCount">' + esc(v.caption) + '</textarea>' +
        '<div class="row" style="justify-content:space-between"><span class="counter' + (l.max && v.caption.length > l.max ? ' over' : '') + '" id="capCount">' + capText(v.caption.length, v.channels) + '</span>' + speakBtn('caption', 'Read my words aloud') + '</div></div>' +
      '<div class="field"><label for="f-cta">What should people do? (call to action)</label><span class="hint">For example: Call us for a quote.</span><input id="f-cta" data-f="cta" type="text" spellcheck="true" value="' + esc(v.cta) + '"></div>' +
      '<div class="field"><label for="f-link">Web link (if there is one)</label><input id="f-link" data-f="link" type="url" value="' + esc(v.link) + '" placeholder="https://"></div>';
  }

  function step3(p, v) {
    const isLI = p.group === 'LinkedIn';
    const chans = split(v.channels), needs = split(v.needs);
    const formats = D.lists.formats.filter(function (f) { return f.group === 'Both' || f.group === p.group; });
    return '<div class="field"><label for="f-canva">Link to the finished design in Canva</label>' +
        '<span class="hint">In Canva, click Share, then See all, then Embed, then Embed again. Copy the Smart embed link and paste it here. That lets the design show up for approval.</span>' +
        '<div class="row"><input id="f-canva" data-f="canva" type="url" value="' + esc(v.canva) + '" style="flex:1;min-width:14rem" placeholder="https://www.canva.com/design/…">' +
        '<button class="btn" type="button" data-paste="f-canva">' + icon('paste') + 'Paste link</button></div></div>' +
      designBox(Object.assign({}, p, { canva: v.canva })) +
      '<div class="field"><span class="q">What does the design look like?</span><div class="choices">' + formats.map(function (f) {
        const on = v.format === f.name;
        return '<button class="choice" type="button" data-set="format" data-val="' + esc(f.name) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' + esc(f.name) + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><span class="q">Where does it post?</span>' + (isLI
        ? '<p class="hint">The LinkedIn company page. Mike and the team share it from their own profiles.</p>'
        : '<div class="choices">' + ['Facebook', 'Instagram', 'Google Business Profile'].map(function (c) {
            const on = chans.indexOf(c) >= 0;
            return '<button class="choice multi" type="button" data-toggle="channels" data-val="' + c + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' + (c === 'Google Business Profile' ? '<span>Google<small>Posted by hand on the day</small></span>' : c) + '</button>'; }).join('') + '</div>') + '</div>' +
      '<div class="field"><span class="q">Still needed (optional)</span><div class="choices">' + D.lists.needs.map(function (n) {
        const on = needs.indexOf(n.name) >= 0;
        return '<button class="choice multi" type="button" data-toggle="needs" data-val="' + esc(n.name) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span><span>' + esc(n.name) + (n.note ? '<small>' + esc(n.note) + '</small>' : '') + '</span></button>'; }).join('') + '</div></div>' +
      '<div class="field"><label for="f-notes">Notes for yourself (optional)</label><textarea id="f-notes" data-f="assetNotes" spellcheck="true">' + esc(v.assetNotes) + '</textarea></div>';
  }

  function step4(p, v) {
    const checks = [
      [!!v.date, 'Post day', 1], [!!v.personas, 'Who it is for', 1], [!!v.checkpoint, 'The post\'s job', 1], [!!v.contentType, 'Kind of post', 1],
      [!!String(v.caption).trim(), 'The words for the post', 2], [!!v.canva, 'The Canva design link', 3], [!!v.channels, 'Where it posts', 3]
    ];
    const missing = checks.filter(function (c) { return !c[0]; });
    const h = '<h2>Ready to send?</h2><div class="need-list">' + checks.map(function (c) {
      return '<div class="need">' + (c[0] ? '<span class="ok">' + icon('check') + '</span>' + esc(c[1]) : '<span class="no">' + icon('x') + '</span>' + esc(c[1]) + ' is missing <button class="btn btn-quiet" type="button" data-step="' + c[2] + '">Go to step ' + c[2] + '</button>') + '</div>'; }).join('') + '</div>';
    if (p.status === 'Ready for approval') return h + '<p class="warn">This post is already waiting for approval. Your changes went with it.</p>';
    if (missing.length) return h + '<p class="hint">Fill in the missing parts, then come back here to send it.</p>';
    return h + '<p>Mike, Crissy or Wendy will check the words and the design together.</p><div class="row"><button class="btn btn-main btn-big btn-wide" type="button" data-send="' + esc(p.id) + '">Send for approval' + icon('arrowR') + '</button></div>';
  }

  function editorSummary(p) {
    SPEAK['sum-' + p.id] = p.caption;
    let h = '<div class="panel">';
    if (p.status === 'Ready for approval') h += '<h2>Waiting for approval</h2><p>Mike, Crissy or Wendy will check it. You don\'t need to do anything right now.</p>';
    if (p.status === 'Approved') h += '<h2>' + (onlyGbp(p) ? 'Approved. Next: post it on Google on ' + esc(fmtLong(p.date)) : 'Approved. Next: schedule it in Canva') + '</h2><p>Approved by ' + esc(p.approvedBy) + '.</p>';
    if (p.status === 'Scheduled') h += '<h2>' + (hasGbp(p) && !p.gbpPosted ? 'Scheduled. Next: post it on Google on ' + esc(fmtLong(p.date)) : 'All done') + '</h2><p>Approved by ' + esc(p.approvedBy) + '. Scheduled by ' + esc(first(p.scheduledBy)) + '.</p>';
    if (p.status === 'Skipped') h += '<h2>This post is skipped</h2><p>It won\'t be posted this month.</p>';
    let acts = '';
    if (p.status === 'Approved' && !onlyGbp(p)) acts += '<button class="btn btn-main btn-big" type="button" data-sched="' + esc(p.id) + '">' + icon('calendar') + 'I scheduled it in Canva</button>';
    if ((p.status === 'Approved' || p.status === 'Scheduled') && hasGbp(p) && !p.gbpPosted) acts += '<button class="btn btn-main btn-big" type="button" data-gbp="' + esc(p.id) + '">' + icon('check') + 'I posted it on Google</button>';
    if (p.status === 'Ready for approval') acts += '<button class="btn btn-big" type="button" data-withdraw="' + esc(p.id) + '">' + icon('undo') + 'Take it back to keep working</button>';
    if (p.status === 'Skipped') acts += '<button class="btn btn-main btn-big" type="button" data-unskip="' + esc(p.id) + '">Bring this post back</button>';
    if (acts) h += '<div class="row">' + acts + '</div>';
    if (p.status === 'Ready for approval' && isApprover()) h += '<div class="row"><button class="btn btn-green btn-big" type="button" data-approve="' + esc(p.id) + '">' + icon('approve') + 'Approve</button><button class="btn btn-big" type="button" data-changes="' + esc(p.id) + '">' + icon('pencil') + 'Needs changes</button></div>';
    h += '</div>' + designBox(p) + (p.caption ? '<div class="caption-view">' + esc(p.caption) + '</div><div class="row">' + speakBtn('sum-' + p.id, 'Read the words aloud') + '</div>' : '') + factsList(p);
    if (p.status === 'Approved' || p.status === 'Scheduled') {
      h += '<div class="panel"><h2>Need to change something?</h2><p>Any change, including a change to the design in Canva, needs a new approval.</p><div class="row">' +
        '<button class="btn" type="button" data-design="' + esc(p.id) + '">' + icon('alert') + 'I changed the design in Canva</button>' +
        '<button class="btn" type="button" data-edit="1">' + icon('pencil') + 'Change the words or details</button>' +
        (p.status === 'Scheduled' ? '<button class="btn btn-quiet" type="button" data-unsched="' + esc(p.id) + '">' + icon('undo') + 'It is not scheduled yet</button>' : '') + '</div></div>';
    }
    return h;
  }

  /* Typing saves by itself after a short pause. Buttons save right away. */
  function wireEditor() {
    paintSave();
    $$('[data-f]').forEach(function (el) {
      el.addEventListener('input', function () {
        ed.vals[el.dataset.f] = el.value;
        if (el.dataset.f === 'caption') {
          SPEAK.caption = el.value;
          const l = capLimit(ed.vals.channels); const c = $('#capCount');
          if (c) { c.textContent = capText(el.value.length, ed.vals.channels); c.classList.toggle('over', !!l.max && el.value.length > l.max); }
        }
        if (el.dataset.f === 'canva') { clearTimeout(ed.canvaTimer); ed.canvaTimer = setTimeout(function () { flushSave().then(function () { if (view === 'post') render(); }); }, 1500); }
        queueSave();
      });
    });
  }
  function changedKeys() { const p = postById(ed.id); return FIELDS.filter(function (k) { return String(ed.vals[k] || '').trim() !== String(p[k] || ''); }); }
  function queueSave() { ed.saved = 'pending'; paintSave(); clearTimeout(ed.timer); ed.timer = setTimeout(flushSave, 1400); }
  function paintSave() {
    const bar = $('#savebar'); if (!bar || !ed) return;
    bar.classList.toggle('err', ed.saved === 'error');
    bar.innerHTML = ({ idle: icon('check') + 'Everything is saved', pending: icon('pencil') + 'Saving in a moment…', saving: icon('clock') + 'Saving…', saved: icon('check') + 'Saved', error: icon('alert') + 'Not saved. Check the internet connection.' })[ed.saved] +
      (ed.saved === 'error' ? '<button class="btn btn-main" type="button" data-retry="1">Try again</button>' : '') +
      (ed.lastUndo && ed.saved !== 'error' ? '<button class="btn" type="button" data-undoedit="1">' + icon('undo') + 'Undo my last change</button>' : '');
  }
  let saveChain = Promise.resolve(true);
  function flushSave(undoing) {
    saveChain = saveChain.then(function () { return doSave(undoing); });
    return saveChain;
  }
  function doSave(undoing) {
    if (!ed) return Promise.resolve(true);
    clearTimeout(ed.timer);
    const p = postById(ed.id); const keys = changedKeys();
    if (!keys.length) { if (ed.saved === 'pending') { ed.saved = 'idle'; paintSave(); } return Promise.resolve(true); }
    if (!prefs.who) { askWho(); return Promise.resolve(false); }
    const body = { id: p.id }, before = { id: p.id };
    keys.forEach(function (k) { body[k] = String(ed.vals[k] || '').trim(); before[k] = p[k] || ''; });
    ed.saved = 'saving'; paintSave();
    const edRef = ed;
    const wasApproved = p.status === 'Approved' || p.status === 'Scheduled';
    return postLong({ action: 'savePost', by: prefs.who, post: body })
      .then(function (r) { return r && r.post ? r : call({ action: 'getPost', id: p.id }); })
      .then(function (r) {
        if (!keys.every(function (k) { return String(r.post[k] || '') === body[k]; })) throw new Error('not saved');
        replacePost(r.post);
        if (ed !== edRef) return true;
        ed.saved = 'saved'; ed.lastUndo = undoing ? null : before;
        if (wasApproved && r.post.status === 'Ready for approval') { render(); showMsg('Your change is saved. The post went back for approval.' + (r.warning ? ' ' + r.warning : ''), 'info'); }
        else if (keys.some(function (k) { return ['date', 'checkpoint', 'personas', 'contentType', 'format', 'channels', 'needs', 'canva'].indexOf(k) >= 0; }) || keys.indexOf('topic') >= 0 && !$('#f-topic')) render();
        else { paintSave(); const h1 = $('.ed-head h1'); if (h1 && keys.indexOf('topic') >= 0) h1.textContent = ed.vals.topic || title(r.post); }
        return true;
      })
      .catch(function (e) { if (ed === edRef) { ed.saved = 'error'; paintSave(); if (e && e.message && e.message !== 'not saved') showMsg(e.message, 'err'); } return false; });
  }

  /* Status changes, with Undo in the message bar. */
  function act(params, msg, undoParams, after) {
    if (!prefs.who) { askWho(); return Promise.resolve(null); }
    return call(Object.assign({ by: prefs.who }, params)).then(function (r) {
      return call({ action: 'all' }).then(function (all) {
        D = all; if (after) after(r); render();
        showMsg(msg + (r && r.warning ? ' ' + r.warning : ''), r && r.warning ? 'info' : 'ok', undoParams ? function () { return act(undoParams, 'Undone.'); } : null);
        return r;
      });
    }).catch(function (e) { showMsg(e.message, 'err'); return null; });
  }

  /* ═══════════ DIALOGS ═══════════ */
  function modal(html, label) {
    $('#overlayWrap').innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(label || 'Dialog') + '">' + html + '</div></div>';
    const f = $('#overlayWrap [aria-pressed="true"], #overlayWrap textarea, #overlayWrap input, #overlayWrap button'); if (f) f.focus();
  }
  function closeModal() { $('#overlayWrap').innerHTML = ''; }
  function ask(text, yes) {
    return new Promise(function (resolve) {
      modal('<h2>' + esc(text) + '</h2><div class="actions"><button class="btn btn-big" type="button" id="askNo">No, go back</button><button class="btn btn-big btn-navy" type="button" id="askYes">' + esc(yes) + '</button></div>', 'Question');
      $('#askNo').onclick = function () { closeModal(); resolve(false); };
      $('#askYes').onclick = function () { closeModal(); resolve(true); };
    });
  }
  function askWho() { settingsDialog(true); }
  let settingsNameOnly = false;
  function settingsDialog(nameOnly) {
    settingsNameOnly = nameOnly;
    const opt = function (key, val, label) { const on = prefs[key] === val; return '<button class="choice" type="button" data-pref="' + key + '" data-val="' + esc(val) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' + label + '</button>'; };
    modal('<h2>' + (nameOnly ? 'Who is working?' : 'Settings') + '</h2>' +
      '<div class="field"><span class="q">Your name</span><div class="choices">' + D.lists.team.map(function (n) { return opt('who', n, esc(n)); }).join('') + '</div></div>' +
      (nameOnly ? '' :
      '<div class="field"><span class="q">Text size</span><div class="choices">' + opt('size', 'normal', 'Large') + opt('size', 'larger', 'Larger') + opt('size', 'largest', 'Largest') + '</div></div>' +
      '<div class="field"><span class="q">Background</span><span class="hint">A soft tint can be easier on the eyes than bright white.</span><div class="choices">' + opt('bg', 'white', 'Bright white') + opt('bg', 'warm', 'Soft cream') + opt('bg', 'cool', 'Soft blue') + '</div></div>' +
      '<div class="field"><span class="q">Read-aloud buttons</span><div class="choices">' + opt('speak', 'on', 'Show them') + opt('speak', 'off', 'Hide them') + '</div></div>') +
      '<div class="actions"><button class="btn btn-navy btn-big" type="button" id="setDone"' + (prefs.who ? '' : ' disabled') + '>Done</button></div>', nameOnly ? 'Who is working' : 'Settings');
    $('#setDone').onclick = function () { if (!prefs.who) return; closeModal(); render(); };
    $$('#overlayWrap [data-pref]').forEach(function (b) {
      b.onclick = function () {
        prefs[b.dataset.pref] = b.dataset.val; savePrefs(); render();
        settingsDialog(settingsNameOnly);
        const again = $('#overlayWrap [data-pref="' + b.dataset.pref + '"][data-val="' + CSS.escape(b.dataset.val) + '"]'); if (again) again.focus();
      };
    });
  }
  function addPostDialog() {
    const m = monthShown; const st = { kind: 'Event', group: 'All Socials', date: '' };
    function draw(focusSel) {
      const keep = $('#apTopic') ? $('#apTopic').value : '';
      const c = function (k, v, label) { const on = st[k] === v; return '<button class="choice" type="button" data-ap="' + k + '" data-val="' + esc(v) + '" aria-pressed="' + on + '"><span class="tick" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' + label + '</button>'; };
      modal('<h2>Add a post to ' + esc(monthName(m)) + '</h2><p class="hint">For an event, a team or brand moment, or an extra post. Before, day-of and after posts are added one at a time.</p>' +
        '<div class="field"><span class="q">What is it?</span><div class="choices">' + c('kind', 'Event', 'An event') + c('kind', 'Brand', 'Brand or team news') + c('kind', 'Extra', 'An extra post') + '</div></div>' +
        '<div class="field"><span class="q">Where does it go?</span><div class="choices">' + c('group', 'All Socials', 'Facebook, Instagram, Google') + c('group', 'LinkedIn', 'LinkedIn') + '</div></div>' +
        '<div class="field"><span class="q">Which day?</span>' + dayGrid(m, 'apday', st.date) + '</div>' +
        '<div class="field"><label for="apTopic">What is it about?</label><input id="apTopic" type="text" spellcheck="true" placeholder="For example: Toy drive at the office"></div>' +
        '<div class="actions"><button class="btn btn-big" type="button" id="apCancel">Cancel</button><button class="btn btn-main btn-big" type="button" id="apAdd">Add the post</button></div>', 'Add a post');
      $('#apTopic').value = keep;
      if (focusSel) { const f = $(focusSel); if (f) f.focus(); }
      $('#apCancel').onclick = closeModal;
      $('#apAdd').onclick = function () {
        const topic = $('#apTopic').value.trim(); closeModal();
        act({ action: 'addPost', month: m, kind: st.kind, group: st.group, date: st.date, topic: topic }, 'Post added.', null,
          function (r) { if (r && r.post) setTimeout(function () { openPost(r.post.id, 'calendar'); }, 0); });
      };
      $$('#overlayWrap [data-ap]').forEach(function (b) { b.onclick = function () { st[b.dataset.ap] = b.dataset.val; draw('#overlayWrap [data-ap="' + b.dataset.ap + '"][data-val="' + CSS.escape(b.dataset.val) + '"]'); }; });
      $$('#overlayWrap [data-apday]').forEach(function (b) { b.onclick = function () { st.date = b.dataset.apday; draw('#overlayWrap [data-apday="' + st.date + '"]'); }; });
    }
    draw();
  }
  function changesDialog(id) {
    modal('<h2>What needs to change?</h2><div class="field"><label for="chNote">Tell Natalie what to fix</label><textarea id="chNote" spellcheck="true"></textarea></div>' +
      '<div class="actions"><button class="btn btn-big" type="button" id="chCancel">Cancel</button><button class="btn btn-main btn-big" type="button" id="chSend">Send it back</button></div>', 'Needs changes');
    $('#chCancel').onclick = closeModal;
    $('#chSend').onclick = function () {
      const note = $('#chNote').value.trim(); if (!note) { $('#chNote').focus(); return; }
      closeModal(); act({ action: 'requestChanges', id: id, note: note }, 'Sent back with your note.', { action: 'backToReady', id: id });
    };
  }
  function holidayDateDialog(id) {
    const x = D.holidays.filter(function (h) { return h.id === id; })[0]; if (!x) return;
    modal('<h2>Which day is ' + esc(x.name) + '?</h2>' + dayGrid(x.month, 'hday', '') + '<div class="actions"><button class="btn btn-big" type="button" id="hdCancel">Cancel</button></div>', 'Pick the date');
    $('#hdCancel').onclick = closeModal;
    $$('#overlayWrap [data-hday]').forEach(function (b) { b.onclick = function () { closeModal(); act({ action: 'setHoliday', id: id, use: x.use, start: b.dataset.hday }, 'Date saved.'); }; });
  }

  /* ═══════════ CLICKS ═══════════ */
  document.addEventListener('click', function (e) {
    const t = e.target.closest('button, a');
    if (!t || t.closest('#overlayWrap')) return;     // dialogs wire their own buttons
    const d = t.dataset;
    if (t.id === 'settingsBtn') { settingsDialog(false); return; }
    if (d.view) {
      const go = function () { ed = null; view = d.view; clearMsg(); render(); window.scrollTo(0, 0); };
      if (view === 'post') flushSave().then(go); else go();
      return;
    }
    if (d.closemsg) { clearMsg(); return; }
    if (d.undo && undoFn) { const f = undoFn; clearMsg(); f(); return; }
    if (d.speak) { speak(SPEAK[d.speak] || '', t); return; }
    if (d.open) { openPost(d.open, view === 'post' ? (ed && ed.from) : view); return; }
    if (d.closepost) { closePost(); return; }
    if (d.month) { monthShown = addMonths(monthShown, Number(d.month)); render(); return; }
    if (d.filter) { groupFilter = d.filter; render(); return; }
    if (d.add) { addPostDialog(); return; }
    if (d.build) { act({ action: 'buildMonth', month: d.build }, monthName(d.build) + ' is set up.'); return; }
    if (d.task) {
      const tk = D.tasks.filter(function (x) { return x.id === d.task; })[0]; const now = !(tk && tk.done);
      act({ action: 'toggleTask', id: d.task, done: String(now) }, now ? 'Checked off: ' + (tk ? tk.title : '') : 'Unchecked: ' + (tk ? tk.title : ''), { action: 'toggleTask', id: d.task, done: String(!now) });
      return;
    }
    if (d.detail) { openDetail[d.detail] = !openDetail[d.detail]; render(); return; }
    if (d.clmonth) { checklistMonth = d.clmonth; render(); return; }
    if (d.newtaskday) { $$('[data-newtaskday]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); }); return; }
    if (d.addtask) {
      const txt = ($('#newTask').value || '').trim(); const day = $('[data-newtaskday][aria-pressed="true"]');
      if (!txt) { showMsg('Type what needs doing first.', 'err'); $('#newTask').focus(); return; }
      if (!day) { showMsg('Pick the day it is due.', 'err'); return; }
      act({ action: 'addTask', title: txt, due: day.dataset.newtaskday, month: checklistMonth }, 'Task added.');
      return;
    }
    if (d.hol) {
      const x = D.holidays.filter(function (h) { return h.id === d.hol; })[0]; const prev = x ? x.use : ''; const nextV = prev === d.v ? '' : d.v;
      act({ action: 'setHoliday', id: d.hol, use: nextV }, (nextV === 'Yes' ? 'Chosen: ' : nextV === 'No' ? 'Skipped: ' : 'Cleared: ') + (x ? x.name : ''), { action: 'setHoliday', id: d.hol, use: prev });
      return;
    }
    if (d.holdate) { holidayDateDialog(d.holdate); return; }
    if (d.addhol) {
      const m = d.addhol;
      const go = function () { act({ action: 'buildMonth', month: m }, 'The chosen holidays are in the ' + monthName(m) + ' plan.'); };
      if (D.builtMonths.indexOf(m) >= 0) go(); else ask(monthName(m) + ' is not set up yet. Set it up now? That also adds its regular posts and checklist.', 'Yes, set it up').then(function (y) { if (y) go(); });
      return;
    }
    if (d.approve) { act({ action: 'approve', id: d.approve }, 'Approved.', { action: 'backToReady', id: d.approve }); return; }
    if (d.changes) { changesDialog(d.changes); return; }
    if (d.retry) { flushSave(); return; }
    if (d.undoedit && ed && ed.lastUndo) { const u = ed.lastUndo; Object.keys(u).forEach(function (k) { if (k !== 'id') ed.vals[k] = u[k]; }); ed.lastUndo = null; render(); flushSave(true); return; }
    if (!ed || view !== 'post') return;
    // Editor
    if (d.step) { ed.step = Number(d.step); flushSave(); render(); window.scrollTo(0, 0); const cur = $('.step[aria-current="step"]'); if (cur) cur.focus({ preventScroll: true }); return; }
    if (d.pickday) { ed.vals.date = d.pickday; render(); flushSave(); return; }
    if (d.set) { ed.vals[d.set] = ed.vals[d.set] === d.val ? '' : d.val; render(); flushSave(); return; }
    if (d.toggle) { const cur = split(ed.vals[d.toggle]); const i = cur.indexOf(d.val); if (i >= 0) cur.splice(i, 1); else cur.push(d.val); ed.vals[d.toggle] = cur.join(', '); render(); flushSave(); return; }
    if (d.paste) {
      const el = document.getElementById(d.paste);
      const fallback = function () { el.focus(); showMsg('Click in the link box, then press the Ctrl key and the V key together to paste.', 'info'); };
      if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(function (txt) { if (!txt) return fallback(); el.value = txt.trim(); el.dispatchEvent(new Event('input')); }).catch(fallback);
      else fallback();
      return;
    }
    if (d.send) { flushSave().then(function (ok) { if (ok) act({ action: 'sendForApproval', id: d.send }, 'Sent for approval.', { action: 'withdraw', id: d.send }); }); return; }
    if (d.withdraw) { act({ action: 'withdraw', id: d.withdraw }, 'Taken back. You can keep working on it.', { action: 'sendForApproval', id: d.withdraw }, function () { if (ed) ed.step = 2; }); return; }
    if (d.sched) { act({ action: 'markScheduled', id: d.sched }, 'Marked as scheduled.', { action: 'unschedule', id: d.sched }); return; }
    if (d.unsched) { act({ action: 'unschedule', id: d.unsched }, 'Marked as not scheduled.', { action: 'markScheduled', id: d.unsched }); return; }
    if (d.gbp) { act({ action: 'markGbpPosted', id: d.gbp, value: 'true' }, 'Marked as posted on Google.', { action: 'markGbpPosted', id: d.gbp, value: 'false' }); return; }
    if (d.design) { const id = d.design; ask('Did you change the design in Canva? It will go back for approval.', 'Yes, I changed it').then(function (y) { if (y) act({ action: 'designChanged', id: id }, 'Thanks. It went back for approval.'); }); return; }
    if (d.edit) { ask('Changing this post sends it back for approval. Go ahead?', 'Yes, make a change').then(function (y) { if (y && ed) { ed.editing = true; ed.step = 2; render(); } }); return; }
    if (d.skip) { const id = d.skip; ask('Skip this post this month?', 'Yes, skip it').then(function (y) { if (y) act({ action: 'skipPost', id: id, value: 'true' }, 'Post skipped.', { action: 'skipPost', id: id, value: 'false' }); }); return; }
    if (d.unskip) { act({ action: 'skipPost', id: d.unskip, value: 'false' }, 'The post is back.', { action: 'skipPost', id: d.unskip, value: 'true' }); return; }
    if (d.delpost) { const id = d.delpost; ask('Delete this post for good?', 'Yes, delete it').then(function (y) { if (y) act({ action: 'deletePost', id: id }, 'Post deleted.', null, function () { if (ed) { view = ed.from; ed = null; } }); }); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !$('#overlayWrap').innerHTML) return;
    const no = $('#askNo') || $('#apCancel') || $('#chCancel') || $('#hdCancel');
    if (no) no.click(); else if (prefs.who) closeModal();
  });
  window.addEventListener('beforeunload', function (e) { if (ed && (ed.saved === 'pending' || ed.saved === 'saving')) { e.preventDefault(); e.returnValue = ''; } });

  /* ═══════════ START ═══════════ */
  if (!PREVIEW && (SCRIPT_URL.indexOf('https://') !== 0 || !KEY)) {
    $('#view').innerHTML = '';
    $('#banner').innerHTML = '<div class="banner">' + (!KEY ? 'The dashboard key file (/team/social-secret.js) is missing on the server. Tell Mike.' : 'The dashboard is not connected to the Google sheet yet. Tell Mike.') + '</div>';
  } else {
    load().then(function () { if (!prefs.who) askWho(); }).catch(function () {});
  }
})();
</script>
</body>
